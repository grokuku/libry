# ─── Libry — stack docker-compose (service séparé, jamais fusionné avec WebClaw) ───
#
# Déploiement : le serveur TIRE l'image publiée sur GHCR — il ne la reconstruit
# jamais localement (le build n'est qu'une option de DÉVELOPPEMENT, voir plus bas) :
#   docker compose pull && docker compose up -d
#
# Adapté à l'environnement réel :
#   • WebClaw tourne sur une AUTRE machine du LAN (http://10.10.0.6:3006) : il n'y
#     a AUCUN service `webclaw` dans cette stack, l'URL est explicite ci-dessous.
#     ⚠️ Depuis Libry c'est le port HÔTE 3006 qui compte (le port interne 3000 de
#     WebClaw ne concerne que son propre conteneur).
#   • Les données de Libry vivent dans l'appdata Unraid (bind mount), comme Pi-Web,
#     mais dans un dossier DÉDIÉ : on ne partage JAMAIS le dossier de Pi-Web.
#   • Libry rejoint le réseau externe `dockercustom` (celui de Pi-Web) tout en
#     restant joignable depuis l'hôte via le port publié 3007.
services:
  libry:
    # Image PUBLIÉE par les workflows GitHub Actions sur GHCR : le serveur la
    # TIRE, il ne la reconstruit pas. Tag ÉPINGLÉ sur une version → déploiement
    # stable, aucune mise à jour surprise (contrairement à `latest`).
    # Le workflow « Release image » (release.yml) publie ce tag en lisant la
    # version de package.json : son premier lancement publie exactement `0.1.0`.
    # ⚠️  Tant que ce workflow n'a pas tourné UNE fois, `0.1.0` n'existe pas
    #     encore sur GHCR (vérifié : seuls `test` et `sha-*` y sont publiés) —
    #     en attendant, prendre la ligne `:test` ci-dessous.
    # Si le paquet GHCR devient privé : se connecter une fois sur le serveur
    # (`docker login ghcr.io`, jeton avec « read:packages ») avant le pull.
    image: ghcr.io/grokuku/libry:0.1.0
    # Alternatives commentées (décommenter UNE ligne, commenter celle du dessus) :
    # image: ghcr.io/grokuku/libry:latest       # dernière release publiée
    # image: ghcr.io/grokuku/libry:test         # dernière CI de `main`
    # image: ghcr.io/grokuku/libry:sha-58d1467  # commit précis (immuable)
    # ── DÉVELOPPEMENT LOCAL uniquement ─────────────────────────────────────────
    # Reconstruire l'image sur cette machine au lieu de la tirer : commenter la
    # ligne `image:` active ci-dessus puis décommenter ces deux lignes :
    # build:
    #   context: .
    container_name: libry
    ports:
      - "3007:3007"
    environment:
      # Serveur / données
      LIBRY_HOST: "0.0.0.0"
      LIBRY_PORT: "3007"
      LIBRY_DATA_DIR: "/app/data"
      # Accès (CORS + clés). Injecter les secrets par l'environnement hôte (.env).
      LIBRY_ALLOWED_ORIGINS: "${LIBRY_ALLOWED_ORIGINS:-}"
      LIBRY_ADMIN_KEYS: "${LIBRY_ADMIN_KEYS:-}"
      LIBRY_LEGACY_KEYS: "${LIBRY_LEGACY_KEYS:-}"
      LIBRY_RATE_LIMIT_PER_MIN: "${LIBRY_RATE_LIMIT_PER_MIN:-600}"
      # Capture d'écran
      CHROMIUM_PATH: "/usr/bin/chromium"
      LIBRY_SHOT_CONCURRENCY: "${LIBRY_SHOT_CONCURRENCY:-2}"
      LIBRY_SHOT_QUEUE_MAX: "${LIBRY_SHOT_QUEUE_MAX:-4}"
      LIBRY_SHOT_TTL_HOURS: "${LIBRY_SHOT_TTL_HOURS:-168}"
      LIBRY_SHOT_INLINE_HTML: "${LIBRY_SHOT_INLINE_HTML:-false}"
      LIBRY_CHROMIUM_NO_SANDBOX: "${LIBRY_CHROMIUM_NO_SANDBOX:-false}"
      # WebClaw : service TIERS sur une autre machine du LAN — mapping hôte 3006.
      WEBCLAW_URL: "${WEBCLAW_URL:-http://10.10.0.6:3006}"
      WEBCLAW_API_KEY: "${WEBCLAW_API_KEY:-}"
      LIBRY_TAVILY_API_KEY: "${LIBRY_TAVILY_API_KEY:-}"
      LIBRY_WEBCLAW_TIMEOUT_MS: "${LIBRY_WEBCLAW_TIMEOUT_MS:-15000}"
      LIBRY_TAVILY_TIMEOUT_MS: "${LIBRY_TAVILY_TIMEOUT_MS:-15000}"
    volumes:
      # Appdata Unraid de Libry — JAMAIS celui de Pi-Web. AVANT le premier
      # démarrage, créer le dossier et le donner à l'utilisateur du conteneur
      # (uid 10001) — sinon Libry ne peut pas écrire ses captures/clés :
      #   mkdir -p /mnt/user/appdata-ssd/Libry/data
      #   chown -R 10001:10001 /mnt/user/appdata-ssd/Libry/data
      - /mnt/user/appdata-ssd/Libry/data:/app/data
    # Chromium headless : /dev/shm trop petit par défaut fait planter le rendu.
    shm_size: "512m"
    restart: unless-stopped
    networks:
      - dockercustom

networks:
  # Réseau EXISTANT du serveur (celui de Pi-Web). Permet d'adresser `libry:3007`
  # par son nom depuis les autres conteneurs du réseau ; le port publié reste la
  # voie d'accès pour l'hôte et le reste du LAN. Si ce réseau n'existait pas sur
  # votre serveur, supprimez ce bloc `networks:` et `networks: - dockercustom` :
  # Libry fonctionne quand même via le port 3007.
  dockercustom:
    external: true
